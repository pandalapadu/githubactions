name: Workflow Dispatch
# Triggers the workflow automatically on every git push to the main branch
on:
  push:
  workflow_dispatch:
jobs:
  hello-first:
    runs-on: ubuntu-latest
    steps:
      - name: step-1 
        run: echo "Hello, World!"

      - name: step-2
        run: echo "I am learning GitHub Actions"

# The Analogy: The Smart Hotel Room
# Imagine you are staying in a high-tech, automated luxury hotel suite:
# • The Workflow: The hotel has pre-programmed automation scripts (e.g., turn on all lights, open the window blinds, play soft jazz music).
# • The Triggers (on:): These are the sensors and switches placed around the room that kick off those actions.
# Let's look at how standard GitHub triggers translate directly to this hotel room:
# 1. The Door Sensor (on: push): The exact moment you swipe your keycard and open the main door, the entryway lights immediately snap on. The system didn't guess; it reacted instantly to a real-world event (opening the door = pushing code to a branch).
# 2. The Motion Detector (on: pull_request): You walk over to the balcony. A motion sensor detects you approaching the edge and automatically rolls out the sun awning. This is like a pull request—someone is trying to bring something new to the main area, so the system runs a pre-check.
# 3. The Alarm Clock (on: schedule): You set a timer. At exactly 7:00 AM, the coffee maker starts brewing automatically. No one touched it; it ran based on a clock schedule (a cron job timer).
# 4. The Manual Wall Switch (on: workflow_dispatch): There is a big button on the wall labeled "Party Mode." It doesn't care what time it is or who is walking past. The lights only flash and the music only plays because you walked up and manually pressed that button.
# 🛠️ How Triggers Look in a Workflow File
# You declare these sensors right at the very top of your GitHub Actions YAML file using the on: keyword:
