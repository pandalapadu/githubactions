name: GitHub Actions Hello World

# Triggers the workflow automatically on every git push to the main branch
on:
  push:
    branches: [ "main" ]
  # Allows you to also trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  say-hello:
    # Specifies the type of virtual runner host machine (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      # Step 1: Execute a standard shell script command string
      - name: Print Hello Message
        run: |
          echo "Hello, World!"
          echo "Current runner environment: Linux Ubuntu"
          echo "Triggered by actor: ${{ github.actor }}"
